name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --platforms=android --org com.paramod.gaming utility_build

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="ARYA-MOD X"/' utility_build/android/app/src/main/AndroidManifest.xml

      - name: Configure Free Fire MAX launcher
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          manifest = Path("utility_build/android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          if "<queries>" not in xml:
              xml = xml.replace(
                  "<manifest",
                  '<manifest',
                  1
              )
              xml = xml.replace(
                  "<application",
                  '    <queries><package android:name="com.dts.freefiremax" /></queries>\n    <application',
                  1
              )
          manifest.write_text(xml)

          candidates = [
              Path("utility_build/android/app/src/main/kotlin/com/paramod/gaming/utility_build/MainActivity.kt"),
              *Path("utility_build/android/app/src/main/kotlin").rglob("MainActivity.kt")
          ]
          kotlin = next((x for x in candidates if x.exists()), None)
          if kotlin is None:
              raise SystemExit("MainActivity.kt not found")
          kotlin.write_text('''package com.paramod.gaming.utility_build

          import android.content.Intent
          import android.content.pm.PackageManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channel = "com.paramod.gaming/launcher"
              private val gamePackage = "com.dts.freefiremax"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channel)
                      .setMethodCallHandler { call, result ->
                          if (call.method != "launchGame") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          val launchIntent = packageManager.getLaunchIntentForPackage(gamePackage)
                          if (launchIntent == null) {
                              result.success("Free Fire MAX not found. Check that it is installed and package matches your version.")
                          } else {
                              try {
                                  startActivity(launchIntent)
                                  result.success("Opening Free Fire MAX")
                              } catch (e: Exception) {
                                  result.error("LAUNCH_FAILED", e.message, null)
                              }
                          }
                      }
              }
          }
          ''')
          PYCODE

      - name: Install app screen
        run: cp lib/main.dart utility_build/lib/main.dart

      - name: Build debug APK
        working-directory: utility_build
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParamodGamingUtilityV2-debug-apk
          path: utility_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
