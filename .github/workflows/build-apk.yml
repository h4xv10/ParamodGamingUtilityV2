name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --platforms=android --org com.paramod.gaming utility_build

      - name: Install app screen
        run: cp lib/main.dart utility_build/lib/main.dart

      - name: Build debug APK
        working-directory: utility_build
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParamodGamingUtilityV2-debug-apk
          path: utility_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
